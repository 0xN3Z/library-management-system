{% extends "base.html" %}

{% block title %}Login — Library Management System{% endblock %}

{% block content %}
<h1>Login</h1>
{% if form.errors %}
<p style="color:#721c24">Your username and password didn't match. Please try again.</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
    <input type="hidden" name="next" value="{{ next }}">
</form>
{% endblock %}
